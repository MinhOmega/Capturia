name: Build Desktop Apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            os: windows-latest
            build_script: npm run build:win
            artifact_name: windows-installer
          - id: linux
            os: ubuntu-latest
            build_script: npm run build:linux
            artifact_name: linux-installers
          - id: macos-x64
            os: macos-13
            build_script: npm run build:mac:x64
            artifact_name: macos-x64-installer
          - id: macos-arm64
            os: macos-14
            build_script: npm run build:mac:arm64
            artifact_name: macos-arm64-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build app
        run: ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows installer
        if: matrix.id == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/**/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux installers
        if: matrix.id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS installers
        if: startsWith(matrix.id, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/**/*.dmg
          if-no-files-found: error
          retention-days: 30
